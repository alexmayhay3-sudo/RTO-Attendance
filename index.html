<!DOCTYPE html>
<html>
<head>
<title>RTO Attendance Tracker</title>

<style>
body{
font-family:Segoe UI, Arial;
background:#1e1e1e;
color:#e6e6e6;
padding:30px;
}

.container{
max-width:100%;
}

table{
border-collapse:collapse;
width:100%;
background:#2a2a2a;
font-size:12px;
}

th{
background:#0f4c81;
color:white;
border:1px solid #444;
padding:6px;
position:sticky;
top:0;
z-index:3;
}

td{
border:1px solid #3b3b3b;
padding:3px;
text-align:center;
min-width:42px;
}

#rtoTable tr:nth-child(even){background:#2f2f2f;}
#rtoTable tr:nth-child(odd){background:#262626;}

td:first-child, th:first-child{
position:sticky;
left:0;
background:#202020;
z-index:2;
}

td:nth-child(2), th:nth-child(2){
position:sticky;
left:120px;
background:#202020;
z-index:2;
}

select{
width:58px;
font-size:10px;
padding:2px;
border-radius:3px;
border:1px solid #555;
background:#1f1f1f;
color:#e6e6e6;
}

.week-nav-btn{
background:#0f4c81;
color:white;
border:none;
border-radius:50%;
width:34px;
height:34px;
font-size:18px;
cursor:pointer;
margin-left:5px;
font-weight:bold;
transition:0.2s;
}

.week-nav-btn:hover{
background:#176b87;
transform:scale(1.05);
}

.RTO{background:#1f6f43;color:white;}
.WFH{background:#176b87;color:white;}
.Vacation{background:#b88a1b;color:black;}
.Sick{background:#6b4fb3;color:white;}
.Off{background:#a93232;color:white;}
.Emergency{background:#b88a1b;color:black;}
.Charity{background:#b88a1b;color:black;}
.WFHspecReq{background:#176b87;color:white;}
.Offset{background:#b88a1b;color:black;}

.week-separator{
background:#111 !important;
min-width:18px !important;
border-left:2px solid #555 !important;
border-right:2px solid #555 !important;
}

.rto-count-low{
background:#a93232 !important;
color:white !important;
font-weight:bold;
}

.rto-count-ok{
background:#1b1b1b !important;
color:#4ea1ff !important;
font-weight:bold;
}

.team-header{
background:#0b2f4f !important;
color:white !important;
font-weight:bold;
text-align:left !important;
padding:8px !important;
font-size:13px;
border-top:3px solid #4ea1ff !important;
}

.team-toggle{
cursor:pointer;
user-select:none;
display:flex;
align-items:center;
gap:8px;
}

.team-arrow{
font-size:11px;
transition:transform 0.2s ease;
display:inline-block;
width:12px;
}

.team-collapsed .team-arrow{
transform:rotate(-90deg);
}

.hidden-team-row{
display:none;
}

#auditTable{
width:100%;
border-collapse:collapse;
background:#2a2a2a;
}

#auditTable th{
background:#1b1b1b;
}

#auditTable td{
border:1px solid #3a3a3a;
padding:6px;
}

.notice{
background:#182733;
padding:10px;
margin-bottom:12px;
border-left:4px solid #4ea1ff;
font-size:12px;
}
</style>
</head>

<body>

<h2>RTO Attendance Tracker</h2>

<div class="notice">
NEW FEATURE: When you set an employee to OFF, you can make it recurring weekly from that date onward.
Future schedule changes will NOT affect old historical months.
</div>

<label>Checker Name:</label>
<input id="editor">

<label>Month:</label>
<select id="monthSelect" onchange="changeMonth()">
<option value="0">January</option>
<option value="1">February</option>
<option value="2">March</option>
<option value="3">April</option>
<option value="4">May</option>
<option value="5">June</option>
<option value="6">July</option>
<option value="7">August</option>
<option value="8">September</option>
<option value="9">October</option>
<option value="10">November</option>
<option value="11">December</option>
</select>

<label>Year:</label>
<select id="yearSelect" onchange="changeMonth()"></select>

<select id="viewMode" onchange="reloadEmployees()">
<option value="month">Full Month</option>
<option value="week" selected>Current Week</option>
</select>

<button class="week-nav-btn" onclick="changeWeek(-1)">←</button>
<button class="week-nav-btn" onclick="changeWeek(1)">→</button>

<h3 id="currentMonth"></h3>

<button onclick="exportTable()">Export to Excel</button>

<br><br>

<div class="container" style="overflow-x:auto">
<table id="rtoTable"></table>
</div>

<h3>Audit Log</h3>

<div style="max-height:300px;overflow-y:auto;background:#2a2a2a;border:1px solid #444;">
<table id="auditTable">
<thead>
<tr>
<th>User</th>
<th>Employee</th>
<th>Date</th>
<th>Status</th>
<th>Time</th>
</tr>
</thead>
<tbody id="auditBody"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDW7OSttX3WtwqcUIgSZkCWDLI-HCAgAMA",
authDomain: "rto-attendance-tracker-c18e8.firebaseapp.com",
databaseURL: "https://rto-attendance-tracker-c18e8-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "rto-attendance-tracker-c18e8",
storageBucket: "rto-attendance-tracker-c18e8.firebasestorage.app",
messagingSenderId: "517181509229",
appId: "1:517181509229:web:7cfecdc0e4e985f3107964"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxOvS_MxvPyjaL66O98RSnEB3Omz3G4a0Mh6WPNu3Zrs3M_NUi3FulIUvFTo0RsMlSAxA/exec"

let employees=[]
let attendance={}
let offSchedules={}
let visibleStartDay=1
let visibleEndDay=31
let daysInMonth=31
let collapsedTeams={}
let weekOffset=0

function toggleTeam(team){

collapsedTeams[team]=!collapsedTeams[team]

let rows=document.querySelectorAll(`[data-team='${team}']`)

rows.forEach(r=>{

if(collapsedTeams[team]){
r.classList.add("hidden-team-row")
}else{
r.classList.remove("hidden-team-row")
}
})

let header=document.querySelector(`[data-team-header='${team}']`)

if(header){

if(collapsedTeams[team]){
header.classList.add("team-collapsed")
}else{
header.classList.remove("team-collapsed")
}
}
}

function changeWeek(direction){

weekOffset += direction

reloadEmployees()
}

function populateYears(){

let yearSelect=document.getElementById("yearSelect")
let currentYear=new Date().getFullYear()

for(let y=2024;y<=2050;y++){

let option=document.createElement("option")

option.value=y
option.text=y

if(y===currentYear){
option.selected=true
}

yearSelect.appendChild(option)
}
}

function setCurrentMonth(){

let now=new Date()

document.getElementById("monthSelect").value=now.getMonth()
}

function getDaysInMonth(year,month){

return new Date(year,month+1,0).getDate()
}

function generateHeader(){

let table=document.getElementById("rtoTable")

let header1=document.createElement("tr")
let header2=document.createElement("tr")

header1.innerHTML="<th>Name</th><th>Team</th>"
header2.innerHTML="<th></th><th></th>"

let month=parseInt(document.getElementById("monthSelect").value)
let year=parseInt(document.getElementById("yearSelect").value)

let view=document.getElementById("viewMode").value

daysInMonth=getDaysInMonth(year,month)

let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]

visibleStartDay=1
visibleEndDay=daysInMonth

if(view==="week"){

let today=new Date()

let baseDate

if(today.getMonth()===month && today.getFullYear()===year){
baseDate=new Date(year,month,today.getDate())
}else{
baseDate=new Date(year,month,1)
}

baseDate.setDate(baseDate.getDate() + (weekOffset * 7))

visibleStartDay=baseDate.getDate()-baseDate.getDay()

visibleEndDay=visibleStartDay+6

if(visibleStartDay<1){
visibleStartDay=1
}

if(visibleEndDay>daysInMonth){
visibleEndDay=daysInMonth
}
}

for(let i=visibleStartDay;i<=visibleEndDay;i++){

let date=new Date(year,month,i)

header1.innerHTML+=`<th>${i}</th>`
header2.innerHTML+=`<th>${days[date.getDay()]}</th>`

if(date.getDay()===6){

header1.innerHTML+=`<th class="week-separator"></th>`
header2.innerHTML+=`<th class="week-separator"></th>`
}
}

table.appendChild(header1)
table.appendChild(header2)
}

/* REST OF YOUR SCRIPT REMAINS EXACTLY THE SAME */
</script>

</body>
</html>
