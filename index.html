<!DOCTYPE html>
<html>
<head>
<title>RTO Attendance Tracker</title>

<style>
body{
font-family:Segoe UI, Arial;
background:#1e1e1e;
color:#e6e6e6;
padding:30px;
}

.container{
max-width:100%;
}

table{
border-collapse:collapse;
width:100%;
background:#2a2a2a;
font-size:12px;
}

th{
background:#0f4c81;
color:white;
border:1px solid #444;
padding:6px;
position:sticky;
top:0;
z-index:3;
}

td{
border:1px solid #3b3b3b;
padding:3px;
text-align:center;
min-width:42px;
}

#rtoTable tr:nth-child(even){background:#2f2f2f;}
#rtoTable tr:nth-child(odd){background:#262626;}

td:first-child, th:first-child{
position:sticky;
left:0;
background:#202020;
z-index:2;
}

td:nth-child(2), th:nth-child(2){
position:sticky;
left:120px;
background:#202020;
z-index:2;
}

select{
width:58px;
font-size:10px;
padding:2px;
border-radius:3px;
border:1px solid #555;
background:#1f1f1f;
color:#e6e6e6;
}

.RTO{background:#1f6f43;color:white;}
.WFH{background:#176b87;color:white;}
.Vacation{background:#b88a1b;color:black;}
.Sick{background:#6b4fb3;color:white;}
.Off{background:#a93232;color:white;}
.Emergency{background:#b88a1b;color:black;}
.Charity{background:#b88a1b;color:black;}
.WFHspecReq{background:#176b87;color:white;}
.Offset{background:#b88a1b;color:black;}

.week-separator{
background:#111 !important;
min-width:18px !important;
border-left:2px solid #555 !important;
border-right:2px solid #555 !important;
}

.rto-count-low{
background:#a93232 !important;
color:white !important;
font-weight:bold;
}

.rto-count-ok{
background:#1b1b1b !important;
color:#4ea1ff !important;
font-weight:bold;
}

.team-header{
background:#0b2f4f !important;
color:white !important;
font-weight:bold;
text-align:left !important;
padding:8px !important;
font-size:13px;
border-top:3px solid #4ea1ff !important;
}

.team-toggle{
cursor:pointer;
user-select:none;
display:flex;
align-items:center;
gap:8px;
}

.team-arrow{
font-size:11px;
transition:transform 0.2s ease;
display:inline-block;
width:12px;
}

.team-collapsed .team-arrow{
transform:rotate(-90deg);
}

.hidden-team-row{
display:none;
}

#auditTable{
width:100%;
border-collapse:collapse;
background:#2a2a2a;
}

#auditTable th{
background:#1b1b1b;
}

#auditTable td{
border:1px solid #3a3a3a;
padding:6px;
}

.notice{
background:#182733;
padding:10px;
margin-bottom:12px;
border-left:4px solid #4ea1ff;
font-size:12px;
}
</style>
</head>

<body>

<h2>RTO Attendance Tracker</h2>

<div class="notice">
NEW FEATURE: When you set an employee to OFF, you can make it recurring weekly from that date onward.
Future schedule changes will NOT affect old historical months.
</div>

<label>Checker Name:</label>
<input id="editor">

<label>Month:</label>
<select id="monthSelect" onchange="changeMonth()">
<option value="0">January</option>
<option value="1">February</option>
<option value="2">March</option>
<option value="3">April</option>
<option value="4">May</option>
<option value="5">June</option>
<option value="6">July</option>
<option value="7">August</option>
<option value="8">September</option>
<option value="9">October</option>
<option value="10">November</option>
<option value="11">December</option>
</select>

<label>Year:</label>
<select id="yearSelect" onchange="changeMonth()"></select>

<select id="viewMode" onchange="reloadEmployees()">
<option value="month">Full Month</option>
<option value="week" selected>Current Week</option>
</select>

<h3 id="currentMonth"></h3>

<button onclick="exportTable()">Export to Excel</button>

<br><br>

<div class="container" style="overflow-x:auto">
<table id="rtoTable"></table>
</div>

<h3>Audit Log</h3>

<div style="max-height:300px;overflow-y:auto;background:#2a2a2a;border:1px solid #444;">
<table id="auditTable">
<thead>
<tr>
<th>User</th>
<th>Employee</th>
<th>Date</th>
<th>Status</th>
<th>Time</th>
</tr>
</thead>
<tbody id="auditBody"></tbody>
</table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDW7OSttX3WtwqcUIgSZkCWDLI-HCAgAMA",
authDomain: "rto-attendance-tracker-c18e8.firebaseapp.com",
databaseURL: "https://rto-attendance-tracker-c18e8-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "rto-attendance-tracker-c18e8",
storageBucket: "rto-attendance-tracker-c18e8.firebasestorage.app",
messagingSenderId: "517181509229",
appId: "1:517181509229:web:7cfecdc0e4e985f3107964"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxOvS_MxvPyjaL66O98RSnEB3Omz3G4a0Mh6WPNu3Zrs3M_NUi3FulIUvFTo0RsMlSAxA/exec"

let employees=[]
let attendance={}
let offSchedules={}
let visibleStartDay=1
let visibleEndDay=31
let daysInMonth=31
let collapsedTeams={}

function toggleTeam(team){

collapsedTeams[team]=!collapsedTeams[team]

let rows=document.querySelectorAll(`[data-team='${team}']`)

rows.forEach(r=>{

if(collapsedTeams[team]){
r.classList.add("hidden-team-row")
}else{
r.classList.remove("hidden-team-row")
}
})

let header=document.querySelector(`[data-team-header='${team}']`)

if(header){

if(collapsedTeams[team]){
header.classList.add("team-collapsed")
}else{
header.classList.remove("team-collapsed")
}
}
}

function populateYears(){

let yearSelect=document.getElementById("yearSelect")
let currentYear=new Date().getFullYear()

for(let y=2024;y<=2050;y++){

let option=document.createElement("option")

option.value=y
option.text=y

if(y===currentYear){
option.selected=true
}

yearSelect.appendChild(option)
}
}

function setCurrentMonth(){

let now=new Date()

document.getElementById("monthSelect").value=now.getMonth()
}

function getDaysInMonth(year,month){

return new Date(year,month+1,0).getDate()
}

function generateHeader(){

let table=document.getElementById("rtoTable")

let header1=document.createElement("tr")
let header2=document.createElement("tr")

header1.innerHTML="<th>Name</th><th>Team</th>"
header2.innerHTML="<th></th><th></th>"

let month=parseInt(document.getElementById("monthSelect").value)
let year=parseInt(document.getElementById("yearSelect").value)

let view=document.getElementById("viewMode").value

daysInMonth=getDaysInMonth(year,month)

let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]

visibleStartDay=1
visibleEndDay=daysInMonth

if(view==="week"){

let today=new Date()

if(today.getMonth()===month && today.getFullYear()===year){

let currentDay=today.getDate()

let currentDate=new Date(year,month,currentDay)

visibleStartDay=currentDay-currentDate.getDay()

if(visibleStartDay<1){
visibleStartDay=1
}

visibleEndDay=visibleStartDay+6

if(visibleEndDay>daysInMonth){
visibleEndDay=daysInMonth
}
}
}

for(let i=visibleStartDay;i<=visibleEndDay;i++){

let date=new Date(year,month,i)

header1.innerHTML+=`<th>${i}</th>`
header2.innerHTML+=`<th>${days[date.getDay()]}</th>`

if(date.getDay()===6){

header1.innerHTML+=`<th class="week-separator"></th>`
header2.innerHTML+=`<th class="week-separator"></th>`
}
}

table.appendChild(header1)
table.appendChild(header2)
}

function changeMonth(){

let monthSelect=document.getElementById("monthSelect")

let year=document.getElementById("yearSelect").value

let monthName=monthSelect.options[monthSelect.selectedIndex].text

document.getElementById("currentMonth").innerText="Viewing: "+monthName+" "+year

reloadEmployees()
}

function getCellColor(status){

if(status=="RTO") return "RTO"
if(status=="WFH") return "WFH"
if(status=="Vacation Leave") return "Vacation"
if(status=="Sick Leave") return "Sick"
if(status=="Off") return "Off"
if(status=="EL") return "Emergency"
if(status=="Charity Leave") return "Charity"
if(status=="WFH spec Req") return "WFHspecReq"
if(status=="Offset") return "Offset"

return ""
}

function getRecurringOff(name,year,month,day){

let employeeRules=offSchedules[name]

if(!employeeRules){
return false
}

let currentDate=new Date(year,month,day)
let weekday=currentDate.getDay()

let matchedRule=null

employeeRules.forEach(rule=>{

let ruleDate=new Date(rule.effectiveDate)

if(rule.weekday===weekday && currentDate>=ruleDate){

if(!matchedRule){
matchedRule=rule
}else{

let existingDate=new Date(matchedRule.effectiveDate)

if(ruleDate>existingDate){
matchedRule=rule
}
}
}
})

return matchedRule ? true : false
}

function createDropdown(name,day){

let month=document.getElementById("monthSelect").value
let year=document.getElementById("yearSelect").value

let key=name+"-"+year+"-"+month+"-"+day

let saved=attendance[key] || ""

if(saved===""){
if(getRecurringOff(name,parseInt(year),parseInt(month),day)){
saved="Off"
}
}

let options=["","RTO","WFH","Vacation Leave","Sick Leave","Off","EL","Charity Leave","WFH spec Req","Offset"]

let html=`<select onchange="logStatus(this,'${name}','${day}')">`

options.forEach(o=>{
html+=`<option ${saved===o?"selected":""}>${o}</option>`
})

html+="</select>"

return html
}

function loadEmployees(){

db.ref("employees").on("value",snapshot=>{

employees=[]

snapshot.forEach(child=>{
employees.push(child.val())
})

reloadEmployees()
})
}

function loadRecurringOff(){

db.ref("offSchedules").on("value",snapshot=>{

offSchedules=snapshot.val() || {}

reloadEmployees()
})
}

function reloadEmployees(){

let table=document.getElementById("rtoTable")

table.innerHTML=""

generateHeader()

let month=document.getElementById("monthSelect").value
let year=document.getElementById("yearSelect").value

let sortedEmployees=[...employees].sort((a,b)=>{

let teamCompare=a.team.localeCompare(b.team)

if(teamCompare!==0){
return teamCompare
}

return a.name.localeCompare(b.name)
})

let currentTeam=""

sortedEmployees.forEach(emp=>{

if(currentTeam!==emp.team){

currentTeam=emp.team

let teamRow=table.insertRow()

teamRow.setAttribute("data-team-header",emp.team)

let totalColumns=table.rows[0].cells.length

let teamCell=teamRow.insertCell(0)

teamCell.colSpan=totalColumns

teamCell.classList.add("team-header")

if(collapsedTeams[emp.team]){
teamRow.classList.add("team-collapsed")
}

teamCell.innerHTML=`
<div class="team-toggle" onclick="toggleTeam('${emp.team}')">
<span class="team-arrow">▼</span>
<span>TEAM: ${emp.team}</span>
</div>
`
}

let row=table.insertRow()

row.setAttribute("data-team",emp.team)

if(collapsedTeams[emp.team]){
row.classList.add("hidden-team-row")
}

row.insertCell(0).innerText=emp.name
row.insertCell(1).innerText=emp.team

for(let i=visibleStartDay;i<=visibleEndDay;i++){

let cell=row.insertCell(-1)

cell.innerHTML=createDropdown(emp.name,i)

let key=emp.name+"-"+year+"-"+month+"-"+i

let saved=attendance[key]

let recurringOff=false

if(saved===""){
if(getRecurringOff(emp.name,parseInt(year),parseInt(month),i)){
saved="Off"
recurringOff=true
}
}

cell.className=""

let color=getCellColor(saved)

if(color){
cell.classList.add(color)
}

if(recurringOff){
cell.style.opacity="0.85"
}

let date=new Date(year,month,i)

if(date.getDay()===6){

let weekRTO=0

for(let d=i-6; d<=i; d++){

if(d<visibleStartDay) continue

let tempKey=emp.name+"-"+year+"-"+month+"-"+d

let tempSaved=attendance[tempKey]

if(tempSaved===""){
if(getRecurringOff(emp.name,parseInt(year),parseInt(month),d)){
tempSaved="Off"
}
}

if(tempSaved==="RTO"){
weekRTO++
}
}

let spacer=row.insertCell(-1)

spacer.classList.add("week-separator")

spacer.innerHTML=weekRTO

if(weekRTO<=3){
spacer.classList.add("rto-count-low")
}else{
spacer.classList.add("rto-count-ok")
}
}
}
})
}

function saveRecurringOff(name,year,month,day){

let targetDate=new Date(year,month,day)

let weekday=targetDate.getDay()

let data={
weekday:weekday,
effectiveDate:targetDate.toISOString()
}

if(!offSchedules[name]){
offSchedules[name]=[]
}

offSchedules[name].push(data)

db.ref("offSchedules/"+name).set(offSchedules[name])
}

function logStatus(select,name,day){

let editor=document.getElementById("editor").value

if(editor==""){
alert("Enter checker name")
select.value=""
return
}

let status=select.value

let month=document.getElementById("monthSelect").value
let year=document.getElementById("yearSelect").value

let key=name+"-"+year+"-"+month+"-"+day

attendance[key]=status

db.ref("attendance/"+key).set(status)

if(status==="Off"){

let recurring=confirm(
"Make this OFF recurring every week from this date onward?\n\nHistorical months will remain unchanged."
)

if(recurring){
saveRecurringOff(name,parseInt(year),parseInt(month),parseInt(day))
}
}

let date=(parseInt(month)+1)+"/"+day+"/"+year

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
editor:editor,
employee:name,
date:date,
status:status
})
})
}

function loadAttendance(){

db.ref("attendance").once("value",snapshot=>{

attendance=snapshot.val() || {}

reloadEmployees()
})
}

function loadLogs(){

fetch(SCRIPT_URL)
.then(res=>res.json())
.then(data=>{

let body=document.getElementById("auditBody")

body.innerHTML=""

data.reverse().forEach(row=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${row[0]}</td>
<td>${row[1]}</td>
<td>${row[2]}</td>
<td>${row[3]}</td>
<td>${row[4]}</td>
`

body.appendChild(tr)
})
})
}

function exportTable(){

let table=document.getElementById("rtoTable")

let rows=table.rows

let html="<table border='1'>"

for(let i=0;i<rows.length;i++){

html+="<tr>"

let cells=rows[i].cells

for(let j=0;j<cells.length;j++){

let cell=cells[j]

let select=cell.querySelector("select")

let value=""

if(select){
value=select.value || ""
}else{
value=cell.innerText || ""
}

html+="<td>"+value+"</td>"
}

html+="</tr>"
}

html+="</table>"

let blob=new Blob([html],{type:"application/vnd.ms-excel"})

let url=URL.createObjectURL(blob)

let link=document.createElement("a")

link.href=url

link.download="RTO_Attendance_"+new Date().toISOString().slice(0,10)+".xls"

document.body.appendChild(link)

link.click()

document.body.removeChild(link)

URL.revokeObjectURL(url)
}

populateYears()
setCurrentMonth()
changeMonth()

loadEmployees()
loadAttendance()
loadLogs()
loadRecurringOff()

setInterval(loadLogs,5000)

</script>

</body>
</html>
